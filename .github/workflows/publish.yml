name: Publish to GitHub Packages
on:
  push:
    branches: [master]
  workflow_dispatch: # force a publish for the current version (bootstrap, or a missed bump)

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"

      - name: Publish only when the version changed
        env:
          GEM_HOST_API_KEY: Bearer ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          curr="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' lib/bard/new/version.rb | head -1)"
          prev="$(git show HEAD~1:lib/bard/new/version.rb 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
          if [ "$curr" = "$prev" ] && [ "$FORCE" != "true" ]; then
            echo "bard-new version unchanged ($curr) — skipping publish."
          else
            echo "Publishing bard-new $curr (was ${prev:-none})."
            gem build bard-new.gemspec
            gem push --host "https://rubygems.pkg.github.com/${{ github.repository_owner }}" bard-new-*.gem
          fi
