name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.3", "3.4", "4.0" ]

    runs-on: ubuntu-latest

    # bard-cli is a private gem in this org's GitHub Packages registry. Same-org, so the
    # built-in GITHUB_TOKEN suffices -- no PAT secret to manage.
    permissions:
      contents: read
      packages: read

    env:
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM: "x-access-token:${{ secrets.GITHUB_TOKEN }}"

    steps:
      # Pinned to full-length SHAs: the botandrosedesign org requires it.
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Install Podman
        run: |
          sudo apt-get update -y
          sudo apt-get install -y podman
          sudo nohup podman system service --time=0 tcp://127.0.0.1:8080 > /tmp/podman-service.log 2>&1 &
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8080/v1.40/version >/dev/null 2>&1; then
              echo "Podman REST API ready at tcp://127.0.0.1:8080"
              break
            fi
            sleep 1
          done
          echo "DOCKER_HOST=tcp://127.0.0.1:8080" >> $GITHUB_ENV

      - name: Build test container images
        run: |
          sudo podman pull ubuntu:24.04
          sudo podman build -t bard-test-provision -f spec/acceptance/docker/Dockerfile.provision spec/acceptance/docker
          sudo podman build -t bard-test-new -f spec/acceptance/docker/Dockerfile.new .

      - name: Run tests
        run: bundle exec rake
